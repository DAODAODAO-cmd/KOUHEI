<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>恶役字幕组 · 字幕清理器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400;1,9..144,600;1,9..144,700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap');

  :root {
    --canvas:    #f3f1eb;
    --paper:     #ffffff;
    --paper-2:   #faf9f4;
    --sunken:    #ecebe4;
    --line:      #e2dfd2;
    --line-soft: #edebe1;
    --line-strong: #c9c4b3;

    --ink:       #15131a;
    --ink-2:     #4a4659;
    --ink-3:     #8a8499;
    --ink-4:     #b8b2c2;

    --accent:        #4a6b8e;
    --accent-2:      #6a8fb8;
    --accent-deep:   #2e4a6b;
    --accent-tint:   rgba(74,107,142,0.08);
    --accent-tint-2: rgba(74,107,142,0.18);
    --accent-glow:   rgba(74,107,142,0.25);

    --serif: 'Fraunces', 'Noto Serif SC', ui-serif, Georgia, serif;
    --serif-cn: 'Noto Serif SC', 'Songti SC', SimSun, serif;
    --sans:  'Inter', -apple-system, 'PingFang SC', 'Noto Sans SC', BlinkMacSystemFont, sans-serif;
    --mono:  'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--canvas);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  /* ════════ TOP STRIP ════════ */
  .topstrip {
    padding: 16px 40px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .top-mark {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-3);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .top-mascot {
    width: 34px; height: 34px;
    object-fit: contain;
    user-select: none; -webkit-user-drag: none;
    cursor: pointer;
    transition: transform 0.25s;
  }
  .top-mascot:hover { transform: scale(1.08) rotate(-3deg); }
  .top-meta {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-3);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    display: flex; align-items: center; gap: 14px;
    font-weight: 500;
  }
  .top-meta .pulse {
    display: inline-flex; align-items: center; gap: 7px;
    color: var(--accent);
    font-weight: 600;
  }
  .top-meta .pulse::before {
    content: ""; width: 6px; height: 6px;
    border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent-glow);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
    50%      { box-shadow: 0 0 0 5px transparent; }
  }
  .top-meta .sep { color: var(--ink-4); }

  /* ════════ HERO ════════ */
  .hero {
    position: relative;
    padding: 60px 60px 100px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 80px;
    align-items: start;
  }

  /* MASTHEAD — the big stacked title block */
  .masthead-title {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 56px;
  }
  .wordmark-img {
    width: 100%;
    max-width: 680px;
    height: auto;
    object-fit: contain;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    /* the cover.png is pure black on transparent — keep as is */
  }
  .tool-title {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(70px, 9.5vw, 132px);
    line-height: 0.9;
    letter-spacing: -0.025em;
    color: var(--ink);
    font-variation-settings: "opsz" 144;
    margin-top: -8px;
    display: flex;
    align-items: baseline;
  }
  .tool-title .period {
    display: inline-block;
    width: 0.13em; height: 0.13em;
    background: var(--ink);
    border-radius: 50%;
    margin-left: 0.06em;
    transform: translateY(-0.04em);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    flex-shrink: 0;
  }
  .tool-title .period:hover {
    transform: translateY(-0.04em) scale(1.18);
    background: var(--accent);
    box-shadow: 0 0 0 0.06em var(--accent-tint);
  }
  .tool-title .period {
    position: relative;
  }
  .tool-title .period::after {
    content: "❌ 我劝你不要连续点";
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    padding: 6px 12px;
    border-radius: 8px;
    letter-spacing: 0.01em;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s 0.3s;
    box-shadow: 0 2px 8px rgba(20,18,28,0.20);
  }
  .tool-title .period::before {
    content: "";
    position: absolute;
    bottom: calc(100% + 3px);
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border: 5px solid transparent;
    border-top-color: var(--ink);
    border-bottom: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s 0.3s;
    z-index: 10;
  }
  .tool-title .period:hover::after,
  .tool-title .period:hover::before {
    opacity: 1;
  }

  /* COPY BLOCK */
  .lead {
    font-family: var(--serif-cn);
    font-size: 24px;
    line-height: 1.6;
    color: var(--ink);
    max-width: 640px;
    font-weight: 600;
    margin-bottom: 18px;
    letter-spacing: -0.005em;
  }
  .sub-line {
    font-family: var(--serif);
    font-style: italic;
    font-size: 22px;
    font-weight: 500;
    color: var(--accent);
    margin-bottom: 28px;
    letter-spacing: -0.005em;
    font-variation-settings: "opsz" 36;
  }
  .deck {
    font-family: var(--serif-cn);
    font-size: 18px;
    line-height: 1.95;
    color: var(--ink-2);
    max-width: 580px;
    font-weight: 400;
    margin-bottom: 44px;
  }
  .deck .em {
    color: var(--accent);
    font-weight: 600;
  }

  .cta-row {
    display: flex; align-items: center; gap: 18px;
    flex-wrap: wrap;
  }
  .cta {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--accent);
    color: var(--paper);
    padding: 17px 34px;
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-decoration: none;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.20) inset,
      0 2px 4px rgba(46,74,107,0.35),
      0 10px 24px -4px rgba(74,107,142,0.40);
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .cta:hover {
    background: var(--accent-2);
    transform: translateY(-2px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.22) inset,
      0 4px 8px rgba(46,74,107,0.40),
      0 16px 32px -4px rgba(74,107,142,0.50);
  }
  .cta:active { transform: translateY(0); }
  .cta .arrow { font-size: 18px; line-height: 1; }
  .mascot-col .cta {
    display: flex;
    width: 100%;
    justify-content: center;
    margin-top: 18px;
    font-size: 18px;
    padding: 20px 36px;
    border-radius: 10px;
    letter-spacing: 0.02em;
  }
  .mascot-col .cta .arrow { font-size: 22px; }

  /* MASCOT (right side) */
  .mascot-col {
    position: relative;
    padding-top: 8px;
  }
  .mascot-card {
    position: relative;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 24px 22px;
    box-shadow:
      0 1px 0 rgba(20,18,28,0.04),
      0 6px 16px rgba(20,18,28,0.06),
      0 24px 48px -16px rgba(20,18,28,0.12);
  }
  .mascot-card::before {
    content: "KIBIKORO · 字幕组吉祥物";
    position: absolute;
    top: -9px; left: 24px;
    background: var(--paper);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.24em;
    padding: 0 8px;
  }
  /* one-shot wiggle when card hovered */
  .mascot-card:hover .mascot-meta .dot {
    animation: wag-dot 1.2s ease-in-out infinite;
  }
  @keyframes wag-dot {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(4px); }
  }
  .mascot-caption {
    margin-top: 14px;
    padding-top: 16px;
    border-top: 1px solid var(--line-soft);
    font-family: var(--serif-cn);
    font-size: 14.5px;
    color: var(--ink-2);
    line-height: 1.7;
    font-weight: 400;
  }
  .mascot-caption strong {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 600;
    color: var(--accent);
    font-size: 16px;
  }
  .mascot-meta {
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.18em;
    color: var(--ink-3);
    text-transform: uppercase;
    font-weight: 600;
  }
  .mascot-meta .dot { color: var(--accent); }


  /* ════════ MASCOT swap + popup ════════ */
  .mascot-img-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 2;
    overflow: visible;
    border-radius: 10px;
    background: var(--paper-2);
  }
  .mascot-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    object-position: center;
    display: block;
    transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), filter 0.4s;
    cursor: pointer;
    user-select: none; -webkit-user-drag: none;
    transform-origin: 50% 90%;
  }
  .mascot-alt {
    object-fit: cover;
    opacity: 0;
    transform: scale(1.08);
    will-change: opacity, transform;
  }
  .mascot-card.flipped .mascot-default { opacity: 0; pointer-events: none; animation: none !important; transform: none !important; }
  .mascot-card.flipped .mascot-alt     { opacity: 1; transform: scale(1); }
  /* 翻转后卡片整体停止抖动 */
  .mascot-card.flipped .mascot-img-wrap { animation: none; }

  /* 持续弹跳：默认就跑，不依赖 hover */
  .mascot-default {
    animation: mascot-idle 2.8s ease-in-out infinite;
    filter: drop-shadow(0 6px 18px rgba(74,107,142,0.22)) drop-shadow(0 2px 6px rgba(74,107,142,0.12));
  }
  .mascot-default:active {
    animation: none !important;
    transform: scale(0.93) rotate(1deg) !important;
    transition: transform 0.1s ease !important;
    filter: drop-shadow(0 2px 6px rgba(74,107,142,0.15)) !important;
  }
  .mascot-alt:hover { transform: scale(1.04); }

  /* 圆点摆动同步 */
  .mascot-meta .dot {
    display: inline-block;
    animation: dot-wag 2.8s ease-in-out infinite;
  }
  @keyframes dot-wag {
    0%,100% { transform: rotate(0deg) scale(1); }
    20%     { transform: rotate(-18deg) scale(1.15); }
    40%     { transform: rotate(12deg) scale(1.1); }
    60%     { transform: rotate(-10deg) scale(1.12); }
    80%     { transform: rotate(8deg) scale(1.08); }
  }

  @keyframes mascot-idle {
    0%   { transform: translateY(0px)   rotate(-1.5deg) scale(1);    }
    15%  { transform: translateY(-7px)  rotate(1deg)    scale(1.02); }
    30%  { transform: translateY(-3px)  rotate(-0.5deg) scale(1.01); }
    45%  { transform: translateY(-8px)  rotate(1.8deg)  scale(1.03); }
    60%  { transform: translateY(-2px)  rotate(-1deg)   scale(1.01); }
    75%  { transform: translateY(-6px)  rotate(1.2deg)  scale(1.02); }
    100% { transform: translateY(0px)   rotate(-1.5deg) scale(1);    }
  }
  .mascot-popup {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 18px;
    padding: 14px 16px;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-family: var(--serif-cn);
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1;
    position: relative;
    /* hidden by default, animates in when shown */
    opacity: 0;
    transform: translateY(-10px) scale(0.88);
    pointer-events: none;
    transition: opacity 0.38s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .mascot-popup::before {
    content: ""; position: absolute;
    top: -7px; left: 50%;
    margin-left: -8px;
    width: 14px; height: 14px;
    background: var(--paper-2);
    border-left: 1px solid var(--line);
    border-top: 1px solid var(--line);
    transform: rotate(45deg);
  }
  .mascot-card.flipped .mascot-popup {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .mascot-popup .eyaku-img {
    height: 30px; width: auto;
    object-fit: contain;
    transform: translateY(-2px) rotate(-2deg);
    filter: drop-shadow(0 2px 0 rgba(0,0,0,0.05));
  }
  .mascot-popup .pop-paw {
    font-size: 16px;
    transform: translateY(-1px) rotate(-12deg);
    margin-left: 2px;
  }
  @keyframes popup-in {
    0%   { opacity: 0; transform: translateY(-6px) scale(0.92); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .paw-trigger {
    cursor: pointer;
    font-size: 13px !important;
    transition: transform 0.2s;
    line-height: 1;
  }
  .paw-trigger:hover { transform: rotate(-12deg) scale(1.2); }

  /* hide old caption-related rules harmlessly */
  .mascot-caption { display: none; }

  /* ════════ KIBI ════════ */
  #kibi-portal {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 9999; overflow: hidden;
  }
  #kibi-portal .kibi {
    position: absolute;
    bottom: 30px; right: 40px;
    width: 220px; height: 220px;
    pointer-events: auto;
    cursor: pointer;
    transform: translateY(280px) rotate(-10deg);
    transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s;
    opacity: 0;
    filter: drop-shadow(0 14px 32px rgba(20,18,28,0.28));
  }
  #kibi-portal .kibi.in {
    transform: translateY(0) rotate(-4deg);
    opacity: 1;
    animation: kibi-float 4s ease-in-out infinite 0.9s;
  }
  #kibi-portal .kibi img {
    width: 100%; height: 100%; object-fit: contain;
    user-select: none; -webkit-user-drag: none;
  }
  #kibi-portal .kibi-tag {
    position: absolute;
    bottom: 240px; right: 50px;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 500;
    padding: 10px 16px;
    border-radius: 18px;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(20,18,28,0.30);
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.4s 0.7s;
    pointer-events: none;
  }
  #kibi-portal .kibi-tag.in { opacity: 1; transform: translateY(0); }
  #kibi-portal .kibi-tag::after {
    content: ""; position: absolute;
    bottom: -7px; right: 36px;
    width: 0; height: 0;
    border: 7px solid transparent;
    border-top-color: var(--ink);
    border-bottom: 0;
  }
  @keyframes kibi-float {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-8px) rotate(-1deg); }
  }

  /* Responsive */
  @media (max-width: 1100px) {
    .hero-grid { grid-template-columns: 1fr; gap: 50px; }
    .mascot-col { max-width: 460px; }
  }
  @media (max-width: 720px) {
    .topstrip, .hero { padding-left: 22px; padding-right: 22px; }
    .hero { padding-top: 36px; padding-bottom: 60px; }
    .tool-title { font-size: clamp(48px, 14vw, 84px); }
    .lead { font-size: 18px; }
    .sub-line { font-size: 17px; }
    .deck { font-size: 15.5px; line-height: 1.85; }
    .mascot-card { padding: 22px 18px 18px; }
  }
</style>
</head>
<body>

<div class="topstrip">
  <div class="top-mark">
    <img class="top-mascot" src="LOGO.png" alt="" id="topMascot">
    <span>恶役字幕組&nbsp;·&nbsp;KOUHEI&nbsp;SUB</span>
  </div>
  <div class="top-meta">
    <span class="pulse">字幕组自用</span>
    <span class="sep">/</span>
    <span>BOD·86114</span>
  </div>
</div>

<section class="hero">
  <div class="hero-grid">
    <div class="hero-main">
      <div class="masthead-title">
        <img class="wordmark-img" src="cover.png" alt="恶役字幕组" id="wordmark">
        <h1 class="tool-title">
          <span>字幕清理器</span><span class="period" id="periodEgg" title="..."></span>
        </h1>
      </div>

      <div class="lead">乱七八糟的字幕，总得有人收拾。</div>
      <div class="sub-line">不是不能手动，只是没必要。</div>
      <div class="deck">
        <span class="em">清理、合并、替换、整理。</span><br>
        把烦人的小问题交给工具，<br>
        把人留给校对。
      </div>

    </div>

    <aside class="mascot-col">
      <div class="mascot-card" id="mascotCard">
        <div class="mascot-img-wrap">
          <img class="mascot-img mascot-default" src="LOGO.png" alt="KOUHEI" id="mascotImg">
          <img class="mascot-img mascot-alt"     src="SUB.jpg" alt="恶役" id="mascotImgAlt">
        </div>
        <div class="mascot-popup" id="mascotPopup">
          <span class="pop-text">今天</span>
          <img class="eyaku-img" src="eyaku.png" alt="恶役">
          <span class="pop-text">了嘛</span>
          <span class="pop-paw">🐾</span>
        </div>
        <div class="mascot-meta">
          <span>恶役字幕組</span>
          <span class="dot paw-trigger" id="pawTrigger" title="...">🐾</span>
          <span>KOUHEI · SUB</span>
        </div>
      </div>
      <a class="cta" href="tool.html" style="margin-top:18px;display:flex;width:100%;justify-content:center;font-size:18px;padding:20px 36px;border-radius:10px;letter-spacing:0.02em;box-sizing:border-box;">
        点击开工
        <span class="arrow" style="font-size:22px;">→</span>
      </a>
      <button onclick="openGame()" style="margin-top:10px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:700;padding:14px 20px;border-radius:10px;letter-spacing:0.04em;box-sizing:border-box;background:#fdf6ed;border:2.5px solid #c4a882;color:#2d1f0e;cursor:pointer;font-family:inherit;box-shadow:3px 3px 0 #e8d5b0;transition:all .15s;" onmouseover="this.style.transform='translate(-1px,-1px)';this.style.boxShadow='4px 4px 0 #e8d5b0'" onmouseout="this.style.transform='';this.style.boxShadow='3px 3px 0 #e8d5b0'">
        <span style="font-size:18px">🐾</span> きびところ
      </button>
    </aside>
  </div>
</section>

<!-- ───────── KIBI 隐藏彩蛋 ───────── -->
<div id="kibi-portal" aria-hidden="true">
  <div class="kibi-tag" id="kibiTag">我是 Kibi · 武田航平爱犬</div>
  <div class="kibi" id="kibiSticker" title="再点我走开">
    <img src="Kibi.png" alt="Kibi">
  </div>
</div>

<script>
(() => {
  const TAGS = [
    '我是 Kibi · 武田航平爱犬',
    '汪？',
    '又被你找到了',
    '熬夜做轴会被我看见的',
    '今日宿題：一行も飛ばさないこと',
    'お疲れ様です',
    '字幕组没有魔法 但有工具',
    '你负责校对 我负责装可爱',
    'Kibi 正在努力假装很专业',
    'おかしいな…这行怎么又回来了',
    '今日も修羅場ですね',
    '今日の目標：字幕を生かすこと',
  ];
  // tagIdx 全局递增，每次出现不同句子
  let tagIdx = -1;
  function nextTag() {
    tagIdx = (tagIdx + 1) % TAGS.length;
    return TAGS[tagIdx];
  }

  const sticker = document.getElementById('kibiSticker');
  const tag = document.getElementById('kibiTag');
  const period = document.getElementById('periodEgg');
  const wordmark = document.getElementById('wordmark');
  const mascot = document.getElementById('mascotImg');
  const topMascot = document.getElementById('topMascot');
  let shown = false;
  let hideTimer = null;
  let periodTaps = [];
  let mascotTaps = [];
  let periodTriggerCount = 0;

  function showKibi(msg) {
    const text = msg || nextTag();
    tag.textContent = text;
    if (shown) {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(hideKibi, 8000);
      return;
    }
    shown = true;
    sticker.classList.add('in');
    tag.classList.add('in');
    document.body.animate(
      [{ transform: 'translate(0,0)' }, { transform: 'translate(-2px,1px)' }, { transform: 'translate(2px,-1px)' }, { transform: 'translate(0,0)' }],
      { duration: 240, iterations: 1 }
    );
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hideKibi, 10000);
  }
  function hideKibi() {
    if (!shown) return;
    shown = false;
    sticker.classList.remove('in');
    tag.classList.remove('in');
    clearTimeout(hideTimer);
  }

  // Trigger 1: click red period 3 times in 4s
  if (period) {
    period.addEventListener('click', (e) => {
      e.stopPropagation();
      const now = Date.now();
      periodTaps.push(now);
      while (periodTaps.length && now - periodTaps[0] > 4000) periodTaps.shift();
      if (periodTaps.length >= 3) {
        periodTaps.length = 0;
        periodTriggerCount++;
        const msg = periodTriggerCount === 1 ? '你按到我了' : '猜猜还有哪里可以找到我～';
        showKibi(msg);
      }
    });
  }

  // Trigger 2: click mascot card image → swap LOGO ↔ photo + show popup
  const mascotCard = document.getElementById('mascotCard');
  function swapMascot() {
    if (!mascotCard) return;
    mascotCard.classList.toggle('flipped');
  }
  if (mascot) mascot.addEventListener('click', swapMascot);
  const mascotAlt = document.getElementById('mascotImgAlt');
  if (mascotAlt) mascotAlt.addEventListener('click', swapMascot);

  // Trigger 3: top mascot — 5 taps in 3s → Kibi
  if (topMascot) {
    topMascot.addEventListener('click', () => {
      const now = Date.now();
      mascotTaps.push(now);
      while (mascotTaps.length && now - mascotTaps[0] > 3000) mascotTaps.shift();
      if (mascotTaps.length >= 5) { mascotTaps.length = 0; showKibi(); }
    });
  }

  // Trigger 5: small paw print in mascot meta → Kibi
  const pawTrigger = document.getElementById('pawTrigger');
  if (pawTrigger) {
    pawTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      showKibi();
    });
  }

  // Trigger 4: type K-I-B-I
  const seq = ['k','i','b','i'];
  let pos = 0;
  document.addEventListener('keydown', (e) => {
    if (e.target.matches && e.target.matches('input, textarea, [contenteditable]')) return;
    const key = e.key.toLowerCase();
    if (key === seq[pos]) {
      pos++;
      if (pos === seq.length) { pos = 0; showKibi('你召唤了我'); }
    } else {
      pos = (key === seq[0]) ? 1 : 0;
    }
  });

  sticker.addEventListener('click', () => {
    sticker.animate(
      [{ transform: 'translateY(0) rotate(-4deg)' }, { transform: 'translateY(-30px) rotate(6deg)' }, { transform: 'translateY(320px) rotate(24deg)', opacity: 0 }],
      { duration: 600, easing: 'cubic-bezier(0.55, 0, 0.7, 0.2)' }
    ).onfinish = hideKibi;
  });
})();
</script>

<!-- ───────── GAME MODAL ───────── -->
<style>
#gm-overlay {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(45,31,14,.5);
  backdrop-filter: blur(5px);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
#gm-overlay.open { opacity: 1; pointer-events: all; }
#gm-box {
  background: #fdf6ed;
  border-radius: 20px;
  border: 2.5px solid #c4a882;
  box-shadow: 8px 8px 0 #e8d5b0, 0 24px 60px rgba(0,0,0,.28);
  width: 100%; max-width: 980px;
  height: 90vh;
  display: flex; flex-direction: column;
  transform: scale(.9) translateY(28px);
  transition: transform .35s cubic-bezier(.34,1.56,.64,1);
  overflow: hidden;
}
#gm-overlay.open #gm-box { transform: scale(1) translateY(0); }
.gm-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 16px;
  background: #fdf6ed;
  border-bottom: 2px solid #e8d5b0;
  flex-shrink: 0;
}
.gm-title {
  font-weight: 700; font-size: 13px; color: #8b5e3c;
  letter-spacing: .08em; display: flex; align-items: center; gap: 7px;
}
.gm-close {
  width: 30px; height: 30px; border-radius: 50%;
  background: #2d1f0e; color: #fff; border: none;
  font-size: 14px; cursor: pointer; line-height: 1;
  transition: transform .15s;
}
.gm-close:hover { transform: scale(1.1) rotate(90deg); }
#gm-frame {
  flex: 1; border: none; width: 100%;
  /* iframe stays alive — only visibility toggled */
}
</style>

<div id="gm-overlay" onclick="gmBgClose(event)">
  <div id="gm-box">
    <div class="gm-bar">
      <div class="gm-title">🐾 ポメポケモン育てゲー — きびところ</div>
      <button class="gm-close" onclick="closeGame()" title="閉じる">✕</button>
    </div>
    <iframe id="gm-frame" src="Pomedex_Game.html" title="ポメポケモン育てゲー" allowfullscreen></iframe>
  </div>
</div>

<script>
let gameLoaded = false;
function openGame() {
  const frame = document.getElementById('gm-frame');
  // Load only once — keeps state across open/close
  if (!gameLoaded) {
    frame.src = 'Pomedex_Game.html';
    gameLoaded = true;
  }
  document.getElementById('gm-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeGame() {
  document.getElementById('gm-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
function gmBgClose(e) {
  if (e.target === document.getElementById('gm-overlay')) closeGame();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeGame(); });
</script>
