<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>字幕清理工具</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f7f7f8;
  color: #1a1a1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  text-align: center;
}

/* 卡片 */
.container {
  background: #ffffff;
  padding: 44px 30px;
  border-radius: 14px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.08);
  width: 90%;
  max-width: 420px;

  opacity: 0;
  transform: translateY(10px);
  animation: fadeIn 0.8s ease forwards;
}

/* LOGO */
.logo {
  width: 140px;
  margin-bottom: 16px;
  opacity: 0;
  transform: translateY(8px);
  animation: fadeIn 1s ease forwards;
  animation-delay: 0.2s;
}

/* 标题 */
h1 {
  font-size: 20px;
  margin-bottom: 6px;
  font-weight: 600;
}

/* 副标题 */
p {
  color: #666;
  margin-bottom: 18px;
  font-size: 13px;
}

/* 标语 */
.slogan {
  font-size: 12px;
  color: #888;
  margin-bottom: 26px;
  font-style: italic;
  letter-spacing: 0.5px;
}

/* 按钮 */
.button {
  padding: 10px 22px;
  background: #6355d4;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  transition: 0.2s;
  font-size: 14px;
  display: inline-block;
}

.button:hover {
  background: #7b6ae0;
  transform: translateY(-1px);
}

/* 底部 */
.footer {
  position: absolute;
  bottom: 18px;
  font-size: 12px;
  color: #999;
}

/* 动画 */
@keyframes fadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGO -->
  <img src="./LOGO.png" class="logo">

  <h1>恶役字幕组字幕清理器</h1>

  <p>把乱七八糟的字幕，整理成能看的样子。</p>

  <!-- 标语 -->
  <div class="slogan">
    能自动的，就别手动了。
  </div>

  <a class="button" href="./tool.html">进入工具</a>

</div>

<div class="footer">
  Subtitle Cleaner Tool
</div>

</body>
</html>
